# 导航子系统寄存器表（唯一来源）
# 生成: python tools/gen_config.py
#   -> rtl/regs/nav_regs_map.vh   (模块内 `include，localparam)
#   -> fw/include/nav_regs_map.h  (C 宏，地址为相对 NAV_BASE 的字节偏移)
#   -> model/nav_regs_map.py
#   -> docs/regmap.md
#
# 总线：32 位数据，16 位字节地址，按字访问。
# acc: rw 读写 / ro 只读 / wo 只写 / w1p 写 1 产生脉冲 / w1c 写 1 清零 / rop 读取即弹出
#      rwe 写入值由硬件采用，读回硬件当前生效值（对端地址：写 PEER_PORT 时一次性生效）
# fields: 名字: [msb, lsb]

blocks:
  - name: SYS
    base: 0x0000
    desc: 系统信息、时间基准、中断
    regs:
      - {name: ID,         off: 0x00, acc: ro,  reset: 0x4E415630, desc: "固定值 'NAV0'"}
      - {name: VERSION,    off: 0x04, acc: ro,  reset: 0x00010000, desc: "版本号 major[31:16] minor[15:0]"}
      - {name: TIME_US,    off: 0x08, acc: ro,  reset: 0, desc: "全局微秒计数器（所有时间戳的时基）"}
      - {name: SCRATCH,    off: 0x0C, acc: rw,  reset: 0, desc: "读写测试"}
      - name: IRQ_STATUS
        off: 0x10
        acc: w1c
        reset: 0
        desc: "中断状态（写 1 清零）"
        fields: {LIDAR_FRAME: [0,0], MAP_READY: [1,1], TRAJ_DONE: [2,2], HOST_RX: [3,3], IMU_RX: [4,4], WDOG: [5,5], LIDAR_DROP: [6,6]}
      - {name: IRQ_ENABLE, off: 0x14, acc: rw,  reset: 0, desc: "中断使能，位定义同 IRQ_STATUS"}

  - name: NETL
    base: 0x1000
    desc: 雷达侧网口（RJ45 / RGMII 百兆）UDP 协议栈
    regs:
      - {name: MAC_LO,   off: 0x00, acc: rw, reset: 0x56000001, desc: "本机 MAC 低 32 位"}
      - {name: MAC_HI,   off: 0x04, acc: rw, reset: 0x0000024E, desc: "本机 MAC 高 16 位"}
      - {name: IP,       off: 0x08, acc: rw, reset: 0xC0A80064, desc: "本机 IPv4（默认 192.168.0.100，与 XT-M60 缺省 192.168.0.101/24 同网段）"}
      - {name: UDP_PORT, off: 0x0C, acc: rw, reset: 7687, desc: "本口接收的 UDP 目的端口（XT-M60 缺省发往 7687）"}
      - name: CTRL
        off: 0x10
        acc: rw
        reset: 0x0000007D
        desc: "控制；RX_NEG=1（缺省）板级 RGMII 在 RXC 下降沿采数据（百兆时在数据窗口中间），0 = 上升沿（上板实测上升沿的错误率随布线在 0.5% 到 100% 之间变）；RAW_EN=1 原始帧接收（ARP 应答、发给本机的 TCP 段交给软核）；LIDAR_TCP=1 软核在收不到雷达帧时自己连 TCP 启动雷达"
        fields: {ENABLE: [0,0], ANY_IP: [1,1], ARP_EN: [2,2], LEARN_PEER: [3,3], RX_NEG: [4,4], RAW_EN: [5,5], LIDAR_TCP: [6,6]}
      - {name: STAT_RX_FRAMES, off: 0x14, acc: ro, reset: 0, desc: "收到的以太网帧数"}
      - {name: STAT_RX_UDP,    off: 0x18, acc: ro, reset: 0, desc: "交付的 UDP 报文数"}
      - {name: STAT_RX_ERR,    off: 0x1C, acc: ro, reset: 0, desc: "错误帧数（MAC 错误/IP 校验和/截断/溢出）"}
      - {name: STAT_ARP,       off: 0x20, acc: ro, reset: 0, desc: "已应答的 ARP 请求数"}
      - {name: STAT_TX_FRAMES, off: 0x24, acc: ro, reset: 0, desc: "发送帧数"}
      - {name: PEER_IP,        off: 0x28, acc: rwe, reset: 0, desc: "对端 IP（LEARN_PEER=1 时由收包自动更新）"}
      - {name: PEER_MAC_LO,    off: 0x2C, acc: rwe, reset: 0, desc: "对端 MAC 低 32 位"}
      - {name: PEER_MAC_HI,    off: 0x30, acc: rwe, reset: 0, desc: "对端 MAC 高 16 位"}
      - {name: PEER_PORT,      off: 0x34, acc: rwe, reset: 0, desc: "发送目的端口 [15:0]"}
      - {name: MCAST_IP,       off: 0x38, acc: rw, reset: 0xEFFFFF4C, desc: "另外接收的组播组（0 = 不收）；缺省 239.255.255.76 = 厂家 SDK 加入的组"}
      - name: PHY_STAT
        off: 0x3C
        acc: ro
        reset: 0
        desc: "板级 RGMII MAC / PHY 状态（rgmii_mac100）：链路、MDIO 初始化、PHY 地址、RX 时钟测频（值 × 64 = kHz，百兆约 390）"
        fields: {LINK: [0,0], INIT_DONE: [1,1], FOUND: [2,2], ADDR: [7,3], RXCLK: [31,16]}
      - {name: RAW_TX, off: 0x40, acc: wo, reset: 0, desc: "写入字节数（<= 128）即发送 LRAW_TX 窗口里的整帧（以太网头起，不含 FCS，不足 60 字节补零）"}
      - name: RAW_STAT
        off: 0x44
        acc: ro
        reset: 0
        desc: "原始帧通道状态：发送忙；接收格数（0–4）；当前格整帧字节数（含 FCS，窗口里只有前 128 字节）；接收丢弃计数（格子满）"
        fields: {TX_BUSY: [0,0], RX_N: [3,1], RX_LEN: [18,8], RX_DROP: [31,24]}
      - {name: RAW_POP, off: 0x48, acc: w1p, reset: 0, desc: "弹出当前接收格"}
      - {name: LIDAR_IP, off: 0x4C, acc: rw, reset: 0xC0A80065, desc: "雷达 IP（软核 TCP 客户端连它的 7787 端口；缺省 192.168.0.101，PC 冒充雷达时改成电脑 IP）"}

  - name: NETH
    base: 0x1100
    desc: 主机侧网口（SFP / 1000BASE-X，接 RK3588）UDP 协议栈
    regs:
      - {name: MAC_LO,   off: 0x00, acc: rw, reset: 0x56000002, desc: "本机 MAC 低 32 位"}
      - {name: MAC_HI,   off: 0x04, acc: rw, reset: 0x0000024E, desc: "本机 MAC 高 16 位"}
      - {name: IP,       off: 0x08, acc: rw, reset: 0xC0A80264, desc: "本机 IPv4（默认 192.168.2.100）"}
      - {name: UDP_PORT, off: 0x0C, acc: rw, reset: 9000, desc: "本口接收的 UDP 目的端口"}
      - name: CTRL
        off: 0x10
        acc: rw
        reset: 0x0000000D
        desc: "控制"
        fields: {ENABLE: [0,0], ANY_IP: [1,1], ARP_EN: [2,2], LEARN_PEER: [3,3]}
      - {name: STAT_RX_FRAMES, off: 0x14, acc: ro, reset: 0, desc: "收到的以太网帧数"}
      - {name: STAT_RX_UDP,    off: 0x18, acc: ro, reset: 0, desc: "交付的 UDP 报文数"}
      - {name: STAT_RX_ERR,    off: 0x1C, acc: ro, reset: 0, desc: "错误帧数"}
      - {name: STAT_ARP,       off: 0x20, acc: ro, reset: 0, desc: "已应答的 ARP 请求数"}
      - {name: STAT_TX_FRAMES, off: 0x24, acc: ro, reset: 0, desc: "发送帧数"}
      - {name: PEER_IP,        off: 0x28, acc: rwe, reset: 0, desc: "对端 IP"}
      - {name: PEER_MAC_LO,    off: 0x2C, acc: rwe, reset: 0, desc: "对端 MAC 低 32 位"}
      - {name: PEER_MAC_HI,    off: 0x30, acc: rwe, reset: 0, desc: "对端 MAC 高 16 位"}
      - {name: PEER_PORT,      off: 0x34, acc: rwe, reset: 9001, desc: "发送目的端口 [15:0]"}
      - {name: MCAST_IP,       off: 0x38, acc: rw, reset: 0, desc: "另外接收的组播组（0 = 不收）"}

  - name: MBX
    base: 0x1200
    desc: 主机报文邮箱（NETH 收到的 UDP 负载 / 软核待发的 UDP 负载）
    regs:
      - name: RX_STAT
        off: 0x00
        acc: ro
        reset: 0
        desc: "接收队列状态"
        fields: {LEN: [15,0], PKTS: [23,16], AVAIL: [31,31]}
      - {name: RX_DATA,   off: 0x04, acc: rop, reset: 0, desc: "读取当前报文的下 4 字节（小端打包）"}
      - {name: RX_POP,    off: 0x08, acc: w1p, reset: 0, desc: "丢弃当前报文剩余部分，切到下一报文"}
      - {name: RX_TS,     off: 0x0C, acc: ro,  reset: 0, desc: "当前报文到达时间 (us)"}
      - {name: RX_SRC_IP, off: 0x10, acc: ro,  reset: 0, desc: "当前报文源 IP"}
      - {name: RX_SRC_PORT, off: 0x14, acc: ro, reset: 0, desc: "当前报文源端口 [15:0]"}
      - {name: TX_DATA,   off: 0x20, acc: wo,  reset: 0, desc: "写入待发负载 4 字节（小端）"}
      - {name: TX_LEN,    off: 0x24, acc: rw,  reset: 0, desc: "待发负载字节数"}
      - {name: TX_GO,     off: 0x28, acc: w1p, reset: 0, desc: "发送（目的地址取 NETH.PEER_*）"}
      - name: TX_STAT
        off: 0x2C
        acc: ro
        reset: 0
        desc: "发送状态"
        fields: {BUSY: [0,0], WORDS: [15,4]}
      - {name: INJ_DATA,  off: 0x30, acc: wo,  reset: 0, desc: "串口注入：写入待注入报文的下 4 字节（小端）。PC 经 uart_bus_bridge 下发报文用，不依赖网口"}
      - {name: INJ_LEN,   off: 0x34, acc: rw,  reset: 0, desc: "串口注入：报文字节数"}
      - {name: INJ_GO,    off: 0x38, acc: w1p, reset: 0, desc: "串口注入：报文入接收队列（与网口收到的报文同样处理；源 IP 记 0）"}
      - {name: TXB_ADDR,  off: 0x3C, acc: rw,  reset: 0, desc: "发送缓冲回读：字地址"}
      - {name: TXB_Q,     off: 0x40, acc: ro,  reset: 0, desc: "发送缓冲回读：该字（最近一次发出的报文仍在缓冲里，PC 经串口读取状态/应答用）"}
      - {name: TX_SEQ,    off: 0x44, acc: ro,  reset: 0, desc: "已发送报文计数（回读前后比较，判断读取期间是否被新报文覆盖）"}

  - name: LIDAR
    base: 0x2000
    desc: XT-M60 帧接收、深度转点云、坐标变换、过滤
    regs:
      - name: CTRL
        off: 0x00
        acc: rw
        reset: 0x00000017
        desc: "格式与流程控制（缺省按厂家 SDK：小端）；AUTO_INFO=1 时深度单位、ROI、像素合并取自帧尾 FrameInfo"
        fields: {ENABLE: [0,0], HDR_LE: [1,1], PIX_LE: [2,2], WAIT_POSE: [3,3], AUTO_INFO: [4,4]}
      - {name: SUBHDR,     off: 0x04, acc: rw, reset: 20, desc: "UDP 分包头字节数（SDK = 20，>= 16）"}
      - name: DEPTH_CFG
        off: 0x08
        acc: rw
        reset: 0x00000100
        desc: "深度换算（帧无 FrameInfo 或 AUTO_INFO=0 时使用）"
        fields: {DEPTH_MUL: [15,0]}
      - name: RANGE
        off: 0x0C
        acc: rw
        reset: 0x4E200064
        desc: "有效距离 mm"
        fields: {MIN_MM: [15,0], MAX_MM: [31,16]}
      - name: VALID_CFG
        off: 0x10
        acc: rw
        reset: 0xFA000000
        desc: "有效性判定：深度为 0、深度或幅值 >= RAW_INV（设备无效码从 64000 起）、幅值 < AMP_MIN 的像素无效"
        fields: {AMP_MIN: [15,0], RAW_INV: [31,16]}
      - name: ROI_OFS
        off: 0x14
        acc: rw
        reset: 0
        desc: "ROI 起点（查表偏移；帧无 FrameInfo 或 AUTO_INFO=0 时使用）"
        fields: {X0: [7,0], Y0: [15,8]}
      - {name: STAT_FRAMES,  off: 0x18, acc: ro, reset: 0, desc: "成功接收的帧数"}
      - {name: STAT_BAD,     off: 0x1C, acc: ro, reset: 0, desc: "格式错误/不完整的帧数"}
      - name: LAST_FRAME
        off: 0x20
        acc: ro
        reset: 0
        desc: "最近成功帧信息"
        fields: {SN: [15,0], DEVSTATE: [23,16], PROTO: [31,24]}
      - name: LAST_WH
        off: 0x24
        acc: ro
        reset: 0
        desc: "最近成功帧分辨率"
        fields: {W: [15,0], H: [31,16]}
      - {name: LAST_TS,     off: 0x28, acc: ro, reset: 0, desc: "最近成功帧的到达时间 (us)"}
      - {name: STAT_POINTS, off: 0x2C, acc: ro, reset: 0, desc: "上一帧有效点数"}
      - {name: STAT_DROP,   off: 0x30, acc: ro, reset: 0, desc: "因缓冲满丢弃的帧数"}
      - {name: STAT_SKIP,   off: 0x34, acc: ro, reset: 0, desc: "跳过的分包数（IMU 等非图像消息、不属于当前帧的零散分包）"}
      - {name: R00, off: 0x40, acc: rw, reset: 16384, desc: "雷达->里程计 旋转矩阵 Q1.14（[15:0] 有符号）"}
      - {name: R01, off: 0x44, acc: rw, reset: 0, desc: ""}
      - {name: R02, off: 0x48, acc: rw, reset: 0, desc: ""}
      - {name: R10, off: 0x4C, acc: rw, reset: 0, desc: ""}
      - {name: R11, off: 0x50, acc: rw, reset: 16384, desc: ""}
      - {name: R12, off: 0x54, acc: rw, reset: 0, desc: ""}
      - {name: R20, off: 0x58, acc: rw, reset: 0, desc: ""}
      - {name: R21, off: 0x5C, acc: rw, reset: 0, desc: ""}
      - {name: R22, off: 0x60, acc: rw, reset: 16384, desc: ""}
      - {name: TX,  off: 0x64, acc: rw, reset: 0, desc: "平移 x (mm, int32)"}
      - {name: TY,  off: 0x68, acc: rw, reset: 0, desc: "平移 y (mm, int32)"}
      - {name: TZ,  off: 0x6C, acc: rw, reset: 0, desc: "平移 z (mm, int32)"}
      - {name: POSE_COMMIT, off: 0x70, acc: w1p, reset: 0, desc: "WAIT_POSE=1 时：位姿已写好，放行当前帧"}
      - name: POSE_STAT
        off: 0x74
        acc: ro
        reset: 0
        desc: "位姿握手状态"
        fields: {WAITING: [0,0]}
      - name: ZBAND
        off: 0x78
        acc: rw
        reset: 0x07D0FC18
        desc: "保留点的高度带（里程计系 mm）"
        fields: {ZMIN: [15,0], ZMAX: [31,16]}
      - {name: LUT_ADDR, off: 0x80, acc: rw, reset: 0, desc: "方向查找表写地址（像素序号，写 LUT_Z 后自增）"}
      - {name: LUT_XY,   off: 0x84, acc: wo, reset: 0, desc: "[11:0] rx, [23:12] ry（单位向量分量，12 位有符号 Q0.11）"}
      - {name: LUT_Z,    off: 0x88, acc: wo, reset: 0, desc: "[11:0] rz，写入即提交一项；全零项 = 该像素无效"}
      - {name: LENS0,    off: 0x90, acc: ro, reset: 0, desc: "最近一帧 FrameInfo 内参 fx（float32 原始位）"}
      - {name: LENS1,    off: 0x94, acc: ro, reset: 0, desc: "fy"}
      - {name: LENS2,    off: 0x98, acc: ro, reset: 0, desc: "cx"}
      - {name: LENS3,    off: 0x9C, acc: ro, reset: 0, desc: "cy"}
      - {name: LENS4,    off: 0xA0, acc: ro, reset: 0, desc: "k1"}
      - {name: LENS5,    off: 0xA4, acc: ro, reset: 0, desc: "k2"}
      - {name: LENS6,    off: 0xA8, acc: ro, reset: 0, desc: "k3"}
      - {name: LENS7,    off: 0xAC, acc: ro, reset: 0, desc: "p1"}
      - {name: LENS8,    off: 0xB0, acc: ro, reset: 0, desc: "p2"}
      - name: INFO_CFG
        off: 0xB4
        acc: ro
        reset: 0
        desc: "最近一帧 FrameInfo：深度单位（mm/LSB）、像素合并（bit1 水平 bit0 竖直）、ROI 起点"
        fields: {UNIT_DIV: [7,0], BINNING: [15,8], ROI_X0: [23,16], ROI_Y0: [31,24]}
      - name: INFO_SIZE
        off: 0xB8
        acc: ro
        reset: 0
        desc: "最近一帧 FrameInfo：结构体大小（应为 206）、图像标志、HDR 模式"
        fields: {INFOSIZE: [15,0], IMG_FLAGS: [23,16], HDR: [31,24]}
      - name: INFO_TEMP
        off: 0xBC
        acc: ro
        reset: 0
        desc: "最近一帧 FrameInfo：温度（int16，传感器 / 灯板）"
        fields: {SENSOR: [15,0], VCSEL: [31,16]}
      - {name: INFO_SEQ, off: 0xC0, acc: ro, reset: 0, desc: "FrameInfo 锁存次数（固件据此发现内参更新）"}

  - name: MAP
    base: 0x3000
    desc: 滚动高程图与可通行性分析
    regs:
      - name: CTRL
        off: 0x00
        acc: rw
        reset: 0x00000005
        desc: "控制"
        fields: {ENABLE: [0,0], AUTO_SWEEP: [2,2]}
      - name: CMD
        off: 0x04
        acc: w1p
        reset: 0
        desc: "命令脉冲"
        fields: {SWEEP: [0,0], CLEAR: [1,1]}
      - {name: INV_RES,  off: 0x08, acc: rw, reset: 1311, desc: "65536/分辨率mm，[15:0]"}
      - {name: CENTER_X, off: 0x0C, acc: rw, reset: 0, desc: "窗口中心世界栅格 x（int32），帧开始时锁存"}
      - {name: CENTER_Y, off: 0x10, acc: rw, reset: 0, desc: "窗口中心世界栅格 y（int32）"}
      - name: VALID_CFG
        off: 0x14
        acc: rw
        reset: 0x000C013C
        desc: "栅格有效性（默认年龄上限 60 帧、最少 1 点、窗口中心 ±12 格不过期）"
        fields: {AGE_MAX: [7,0], CNT_MIN: [11,8], KEEP_R: [19,16]}
      - name: THR0
        off: 0x18
        acc: rw
        reset: 0x0032001E
        desc: "致命阈值 mm：台阶（8 邻域最大高差；30 = 可跨门槛 15 与不可跨路沿 50 之间）、格内粗糙度 50"
        fields: {STEP_MAX: [15,0], ROUGH_MAX: [31,16]}
      - name: THR1
        off: 0x1C
        acc: rw
        reset: 0x00190039
        desc: "坡度：4 格基线门控净升高阈值 mm（= 4·res·tan 最大坡度，57 ≈ 16°）；跳变门限 mm（单段超过它按台阶处理，25）"
        fields: {SLOPE_RISE: [15,0], JUMP: [23,16]}
      - name: WEIGHT
        off: 0x20
        acc: rw
        reset: 0x002030A0
        desc: "代价权重 (>>8)"
        fields: {K_SLOPE: [7,0], K_STEP: [15,8], K_ROUGH: [23,16]}
      - name: INFL
        off: 0x24
        acc: rw
        reset: 0x14
        desc: "膨胀半径（格，按底盘外接圆半径设置：209 mm -> 4 格，tools/robot_calib.py）；DISK=1 圆形膨胀（半径 <= 4），否则方形（斜向多出 √2 倍，斜对角的窄缝会被堵死）"
        fields: {RADIUS: [3,0], DISK: [4,4]}
      - name: STAT
        off: 0x28
        acc: ro
        reset: 0
        desc: "状态"
        fields: {BUSY: [0,0], FRONT: [1,1], SEQ: [31,16]}
      - {name: LAT_CX,    off: 0x2C, acc: ro, reset: 0, desc: "当前前台代价图对应的窗口中心 x"}
      - {name: LAT_CY,    off: 0x30, acc: ro, reset: 0, desc: "当前前台代价图对应的窗口中心 y"}
      - {name: STAT_UPD,  off: 0x34, acc: ro, reset: 0, desc: "上一帧写入的点数"}
      - {name: STAT_DROP, off: 0x38, acc: ro, reset: 0, desc: "上一帧被窗口/高度带剔除的点数"}
      - {name: FRAME_CNT, off: 0x3C, acc: ro, reset: 0, desc: "地图帧计数（栅格年龄基准）"}
      - name: DROP
        off: 0x40
        acc: rw
        reset: 0x00000410
        desc: "遮挡落差：扫描距离（格）；基线无效时每格允许的下降 mm"
        fields: {DROP_K: [4,0], DROP_SLOPE: [15,8]}
      - name: FILL
        off: 0x44
        acc: rw
        reset: 0x00281E05
        desc: "空洞填补：最少已观测邻居数、邻居高差极差上限 mm、填补代价"
        fields: {FILL_MIN: [3,0], FILL_TOL: [15,8], FILL_COST: [23,16]}
      - {name: ELEV_ADDR, off: 0x48, acc: rw, reset: 0, desc: "高程图读：槽地址 [13:0]（= (iy&127)<<7 | (ix&127)）"}
      - name: ELEV_CMD
        off: 0x4C
        acc: w1p
        reset: 0
        desc: "高程图读命令（地图更新/扫描空闲时服务，通常数拍内完成）"
        fields: {READ: [0,0]}
      - {name: ELEV_Q0, off: 0x50, acc: ro, reset: 0, desc: "读出槽字 [31:0] = {zmin[15:0], zmax[15:0]}"}
      - name: ELEV_Q1
        off: 0x54
        acc: ro
        reset: 0
        desc: "读出槽字高位与完成标志"
        fields: {CNT: [3,0], TAG: [11,4], STAMP: [19,12], DONE: [31,31]}

  - name: TRAJ
    base: 0x4000
    desc: 候选轨迹并行评估
    regs:
      - {name: CMD,  off: 0x00, acc: w1p, reset: 0, desc: "[0] 启动"}
      - name: STAT
        off: 0x04
        acc: ro
        reset: 0
        desc: "状态"
        fields: {BUSY: [0,0], DONE: [1,1], STALE: [2,2]}
      - name: CFG
        off: 0x08
        acc: rw
        reset: 0x00002010
        desc: "规模"
        fields: {K: [7,0], T: [15,8]}
      - {name: X0,  off: 0x0C, acc: rw, reset: 0, desc: "起点世界栅格 x，Q24.8"}
      - {name: Y0,  off: 0x10, acc: rw, reset: 0, desc: "起点世界栅格 y，Q24.8"}
      - {name: TH0, off: 0x14, acc: rw, reset: 0, desc: "起点航向 [15:0]，65536 = 一周"}
      - name: CMAX
        off: 0x18
        acc: rw
        reset: 253
        desc: "代价 >= CMAX 视为碰撞"
        fields: {CMAX: [7,0]}

  - name: SAFE
    base: 0x5000
    desc: 速度指令安全限幅、看门狗、底盘接口
    regs:
      - name: CTRL
        off: 0x00
        acc: rw
        reset: 0
        desc: "控制"
        fields: {ENABLE: [0,0], HOLONOMIC: [1,1], ESTOP: [2,2]}
      - name: LIM_V
        off: 0x04
        acc: rw
        reset: 0x012C03E8
        desc: "速度上限 mm/s"
        fields: {VX_MAX: [15,0], VY_MAX: [31,16]}
      - name: LIM_W
        off: 0x08
        acc: rw
        reset: 1500
        desc: "角速度上限 mrad/s [15:0]"
      - name: LIM_A
        off: 0x0C
        acc: rw
        reset: 0x00030002
        desc: "每节拍最大变化量"
        fields: {DV: [15,0], DW: [31,16]}
      - {name: TICK_US, off: 0x10, acc: rw, reset: 1000, desc: "输出节拍周期 us"}
      - {name: WD_US,   off: 0x14, acc: rw, reset: 200000, desc: "指令超时 us"}
      - name: CMD_V
        off: 0x18
        acc: rw
        reset: 0
        desc: "期望速度 mm/s（有符号）"
        fields: {VX: [15,0], VY: [31,16]}
      - name: CMD_W
        off: 0x1C
        acc: rw
        reset: 0
        desc: "期望角速度与模式；写入即提交一条指令"
        fields: {WZ: [15,0], MODE: [23,16]}
      - {name: OUT_V, off: 0x20, acc: ro, reset: 0, desc: "当前输出 vx[15:0] vy[31:16]"}
      - {name: OUT_W, off: 0x24, acc: ro, reset: 0, desc: "当前输出 wz[15:0] mode[23:16]"}
      - name: STAT
        off: 0x28
        acc: ro
        reset: 0
        desc: "状态"
        fields: {WDOG: [0,0], ESTOP: [1,1], EXT: [7,4], SEQ: [31,16]}
      - {name: EXT_MASK, off: 0x2C, acc: rw, reset: 0, desc: "外部急停输入使能 [3:0]"}
      - {name: ODO_V,  off: 0x30, acc: ro, reset: 0, desc: "底盘回传 vx[15:0] vy[31:16] mm/s"}
      - {name: ODO_W,  off: 0x34, acc: ro, reset: 0, desc: "底盘回传 wz[15:0] mrad/s"}
      - {name: ODO_TS, off: 0x38, acc: ro, reset: 0, desc: "底盘回传时间 us"}
      - {name: ODO_CNT, off: 0x3C, acc: ro, reset: 0, desc: "底盘回传计数"}

  - name: IMU
    base: 0x6000
    desc: IMU 串口（协议由固件解析）
    regs:
      - {name: BAUD_DIV, off: 0x00, acc: rw, reset: 868, desc: "时钟/波特率（100MHz/115200≈868）"}
      - name: RX_DATA
        off: 0x04
        acc: rop
        reset: 0
        desc: "读取即弹出"
        fields: {DATA: [7,0], FIRST: [8,8], VALID: [31,31]}
      - {name: RX_COUNT, off: 0x08, acc: ro, reset: 0, desc: "接收缓冲字节数"}
      - {name: RX_TS,    off: 0x0C, acc: rop, reset: 0, desc: "读取即弹出：每个突发首字节的到达时间"}
      - {name: TX_DATA,  off: 0x10, acc: wo, reset: 0, desc: "发送 1 字节"}
      - name: TX_STAT
        off: 0x14
        acc: ro
        reset: 0
        desc: "发送状态"
        fields: {BUSY: [0,0], FULL: [1,1]}
      - {name: IDLE_US,  off: 0x18, acc: rw, reset: 500, desc: "空闲多少 us 视为新突发"}
      - {name: STAT_OVF, off: 0x1C, acc: ro, reset: 0, desc: "接收溢出字节数"}

  - name: MATCH
    base: 0x7000
    desc: SLF 结构似然场匹配定位（结构点提取 / 打分 / 并图 / 似然场建图）
    regs:
      - name: CTRL
        off: 0x00
        acc: rw
        reset: 1
        desc: "控制：PRIOR=1 有图模式（窗口原点固定为 LFO_*，UPDATE 只释放点缓冲不并图，打分核对槽字标签）；NOGATE=1 打分不门控（对准）"
        fields: {ENABLE: [0,0], PRIOR: [1,1], NOGATE: [2,2]}
      - name: ZREL
        off: 0x04
        acc: rw
        reset: 0x05DC003C
        desc: "结构点高度带（相对机器人足底 mm，= 帧平移 TZ − MOUNT_Z）"
        fields: {ZLO: [15,0], ZHI: [31,16]}
      - {name: MOUNT_Z, off: 0x08, acc: rw, reset: 155, desc: "雷达光心相对机器人足底的高度 mm（= 腿长 L0 + 25，tools/robot_calib.py；须与固件 pose_init 一致）"}
      - name: CMD
        off: 0x0C
        acc: w1p
        reset: 0
        desc: "命令：打分 / 并图（并图后自动建似然场）/ 清空结构图"
        fields: {EVAL: [0,0], UPDATE: [1,1], CLEAR: [2,2]}
      - name: STAT
        off: 0x10
        acc: ro
        reset: 0
        desc: "状态"
        fields: {BUSY: [0,0], PTS_READY: [1,1], EVAL_DONE: [2,2], NPTS: [28,16]}
      - {name: CX_MM, off: 0x14, acc: rw, reset: 0, desc: "候选旋转中心 x（里程计系 mm，机器人位置）"}
      - {name: CY_MM, off: 0x18, acc: rw, reset: 0, desc: "候选旋转中心 y"}
      - {name: NCAND, off: 0x1C, acc: rw, reset: 245, desc: "候选数 [8:0]（<= 256）"}
      - {name: UPD_DX, off: 0x20, acc: rw, reset: 0, desc: "并图修正量 dx mm（int32）"}
      - {name: UPD_DY, off: 0x24, acc: rw, reset: 0, desc: "并图修正量 dy mm"}
      - {name: UPD_DYAW, off: 0x28, acc: rw, reset: 0, desc: "并图修正量 dyaw [15:0]（65536/周）"}
      - {name: DBG_ADDR, off: 0x2C, acc: rw, reset: 0, desc: "结构图调试读：槽地址 [15:0]"}
      - name: DBG_CMD
        off: 0x30
        acc: w1p
        reset: 0
        desc: "结构图调试读命令"
        fields: {READ: [0,0]}
      - name: DBG_Q
        off: 0x34
        acc: ro
        reset: 0
        desc: "结构图槽字（18 位）{tag, hit, cx, cy, occ, q, has, gate} 与完成标志"
        fields: {WORD: [17,0], DONE: [31,31]}
      - {name: LFO_X, off: 0x38, acc: rw, reset: 0, desc: "有图模式：似然场窗口原点 x（全局 5 cm 格，int32）"}
      - {name: LFO_Y, off: 0x3C, acc: rw, reset: 0, desc: "有图模式：似然场窗口原点 y"}
      - {name: SM_ADDR, off: 0x40, acc: rw, reset: 0, desc: "先验图写入：槽地址 [15:0]"}
      - {name: SM_WDATA, off: 0x44, acc: wo, reset: 0, desc: "先验图写入：槽字 [17:0]，写入即写 RAM（写完 SM_ADDR 自增 1）"}

windows:
  - {name: LRAW_TX, base: 0xD000, size: 0x0080, desc: "雷达口原始帧发送缓冲：字 k = 第 4k..4k+3 字节（小端），只写"}
  - {name: LRAW_RX, base: 0xD100, size: 0x0080, desc: "雷达口原始帧接收当前格：字 k = 第 4k..4k+3 字节（小端），只读"}
  - {name: TRAJ_CAND, base: 0x4100, size: 0x0200, desc: "候选 k: +8k: [15:0]dvx [31:16]dvy (格 Q8/步); +8k+4: [15:0]dth (65536/周/步)"}
  - {name: TRAJ_RES,  base: 0x4400, size: 0x0400, desc: "结果 k: +16k: [7:0]max_cost [15:8]n_unknown [23:16]coll_step [24]collide [25]left; +4 sum_cost; +8 end_x Q8; +12 end_y Q8"}
  - {name: MATCH_CAND, base: 0xC000, size: 0x0800, desc: "SLF 候选 k: +8k: [15:0]dx [31:16]dy (mm); +8k+4: [15:0]dyaw (65536/周)"}
  - {name: MATCH_RES,  base: 0xC800, size: 0x0800, desc: "SLF 结果 k: +8k: 代价（1/16 格，截断法向距离和）; +8k+4: [15:0]参与点数 [31:16]近邻命中点数"}
  - {name: COSTMAP,   base: 0x8000, size: 0x4000, desc: "前台代价图，字节 (sy*128+sx)，sx/sy 为槽坐标 = 世界栅格 & 127；0..200 可通行代价，253 膨胀，254 致命，255 未知"}
